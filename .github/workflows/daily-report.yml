name: Daily Investment Report

on:
  schedule:
    # 每天台灣時間 08:30 執行（UTC 00:30，注意夏令時區不影響台灣）
    - cron: '30 0 * * *'
  workflow_dispatch: {}   # 允許手動在 GitHub 網頁上點一下立即執行測試

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate report
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_report.py

      - name: Commit report.json and asset_history.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add report.json asset_history.json
          git commit -m "每日晨報更新 $(date +'%Y-%m-%d')" || echo "no changes"
          git push
